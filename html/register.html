<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Register</title>
</head>
<body>
    <header class="header">
        <i  id="icon" class="fa-regular fa-file-lines"></i>
        <h1>Invoice Tracker</h1>
    </header>
    <section class="register">
        <i  id="icon" class="fa-regular fa-file-lines"></i>
        <h2>Invoice Tracker</h2>
        <p class="register-text">Create an account to start tracking your invoices.</p>
        <form action="" id="registerForm">
         <label for="fullName">Full Name</label>
           <div class="inputBox">
            <i class="fa-regular fa-user"></i>
            <input type="text" placeholder="Enter your full name" id="fullName" required>
           </div>
           <label for="email">Email</label>
              <div class="inputBox">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" placeholder="Enter your email" id="email" required>
              </div>    
              <label for="password">Password</label>
                <div class="inputBox">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Enter your password" id="password" required>
                     <i class="fa-regular fa-eye" id="togglePassword"></i>
                </div>
                <label for="confirmPassword">Confirm Password</label>
                <div class="inputBox">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Confirm your password" id="confirmPassword" required>
                     <i class="fa-regular fa-eye" id="toggleConfirmPassword"></i>
                </div>
              <div class="terms">
              <input type="checkbox" id="terms">

               <label for="terms">
                 I agree to the
              <span>Terms of Service</span>
                and
             <span>Privacy Policy</span>
                 </label>
            </div>
                <button type="submit" class="registerBtn">Register</button>
          <div class="divider">
              <div class="line"></div>
                <p>or</p>
              <div class="line"></div>
         </div>

             <div class="login-link">
                <p>
                 Already have an account?
                 <span> <a href="login.html">Login</a></span>
                 </p>
                 </div>
        </form>
    </section>
     <footer class="footer">
        <p>&copy; 2024 Invoice Tracker. All rights reserved.</p>
    </footer>
    <script src="../js/register.js"></script>
</body>
</html>
