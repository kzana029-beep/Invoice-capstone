<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Customers</title>
</head>
<body>
      <header class="header">
  <div class="left-header">
    <i class="fa-solid fa-bars" id="burgerMenu"></i>
    <h1>Invoice Tracker</h1>
  </div>

  <div class="user-info" id="userInfo">
    <i class="fa-solid fa-circle-user" id="userIcon"></i>
  <span  id="welcomeUser"></span>
  <i class="fa-solid fa-chevron-down" id="profileArrow"></i>
</div>

    <div class="dropdown" id="dropdown">
      <a href="settings.html" id="switchAccount">Settings</a>
      <button id="logoutBtn">Logout</button>
    </div>
</header>
  <aside class="side-menu" id="sideMenu">
  <a href="dashboard.html">
  <i class="fa-solid fa-house"></i>
  Dashboard
</a>
  <a href="invoices.html"> <i class="fa-solid fa-file-invoice"></i> Invoices</a>
  <a href="customers.html" class="active" > <i class="fa-solid fa-users"></i> Customers</a>
  <a href="settings.html"> <i class="fa-solid fa-gear"></i> Settings</a>
 <button id="toggleSidebar" class="sidebar-toggle">
  <i class="fa-solid fa-arrow-right-arrow-left"></i>
</button>
</aside>
<main class="customers-main">

  <section class="customers-top">
    <div>
      <h2>Customers</h2>
      <p>Manage all your clients in one place.</p>
    </div>

    <button id="addCustomerBtn" class="add-customer-btn">
      <i class="fa-solid fa-plus"></i>
      Add Customer
    </button>
  </section>

  <section class="customers-stats">

    <div class="customer-card">
      <i class="fa-solid fa-users"></i>
      <div>
        <h3 id="totalCustomers">0</h3>
        <span>Total Customers</span>
      </div>
    </div>

    <div class="customer-card active">
      <i class="fa-solid fa-user-check"></i>
      <div>
        <h3 id="activeCustomers">0</h3>
        <span>Active Customers</span>
      </div>
    </div>

  </section>

  <section class="customers-table-section">

    <div class="table-header">
      <input
        type="text"
        id="searchCustomer"
        placeholder="Search customers..."
      />
    </div>

    <table class="customers-table">

      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Company</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="customersTableBody"></tbody>

    </table>

  </section>

</main>
<script src="../js/customers.js"></script>
</body>
</html>
